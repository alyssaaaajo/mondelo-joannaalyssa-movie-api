<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Collection</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px; background: #f5f5f5; font-family: Arial, sans-serif; color: #111; }
    main { max-width: 570px; margin: 0 auto; padding: 22px 16px; background: white; border-radius: 7px; }
    h1 { text-align: center; font-size: 22px; margin: 5px 0 15px; }
    h2 { font-size: 16px; margin: 12px 0 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1 1 108px; min-width: 0; padding: 7px 8px; border: 1px solid #ccc; }
    button { border: 1px solid #bbb; background: #f4f4f4; padding: 7px 9px; cursor: pointer; }
    button:hover { background: #e7e7e7; }
    #message { font-size: 12px; font-weight: bold; min-height: 18px; margin: 8px 0; }
    #message.error { color: #b00020; }
    #loadMovies { margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 7px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>
  <main>
    <h1>Movie Collection</h1>
    <h2>Add Movie</h2>
    <form id="movieForm">
      <input id="title" type="text" placeholder="Title" aria-label="Movie title" required />
      <input id="genre" type="text" placeholder="Genre" aria-label="Movie genre" required />
      <input id="year" type="number" placeholder="Year" aria-label="Movie year" min="1888" step="1" required />
      <button type="submit">Add Movie</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <h2>Movies</h2>
    <button id="loadMovies" type="button">Load Movies</button>
    <table>
      <thead><tr><th>ID</th><th>Title</th><th>Genre</th><th>Year</th></tr></thead>
      <tbody id="moviesTable"></tbody>
    </table>
  </main>
  <script>
    const tableBody = document.getElementById('moviesTable');
    const message = document.getElementById('message');

    async function loadMovies() {
      try {
        const response = await fetch('/api/movies');
        if (!response.ok) throw new Error('Could not load movies');
        const movies = await response.json();
        tableBody.replaceChildren();
        for (const movie of movies) {
          const row = document.createElement('tr');
          for (const field of ['id', 'title', 'genre', 'year']) {
            const cell = document.createElement('td');
            cell.textContent = movie[field];
            row.appendChild(cell);
          }
          tableBody.appendChild(row);
        }
      } catch (error) {
        message.textContent = error.message;
        message.className = 'error';
      }
    }

    document.getElementById('movieForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const movie = {
        title: document.getElementById('title').value,
        genre: document.getElementById('genre').value,
        year: Number(document.getElementById('year').value)
      };
      try {
        const response = await fetch('/api/movies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(movie)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not add movie');
        message.textContent = 'Movie added successfully';
        message.className = '';
        event.target.reset();
        await loadMovies();
      } catch (error) {
        message.textContent = error.message;
        message.className = 'error';
      }
    });

    document.getElementById('loadMovies').addEventListener('click', loadMovies);
    loadMovies();
  </script>
</body>
</html>
